name: Monitor Economic Calendar

on:
  schedule:
    # Every 10 minutes (UTC). GitHub Actions' recommended minimum
    # interval on the free tier is ~5 minutes, but delays can happen
    # (GitHub doesn't guarantee exact timing, especially under load).
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # Also allows manual runs (from the GitHub UI)

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node scripts/monitor.js
        env:
          FINANCECALENDAR_API_KEY: ${{ secrets.FINANCECALENDAR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
